services:
  - type: web
    name: campushire-api
    runtime: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CORS_ALLOWED_ORIGINS
        value: https://24eg107f02.netlify.app
      - key: DB_URL
        value: jdbc:mysql://mysql-14a2be27-anurag-bb4a.j.aivencloud.com:23883/defaultdb?sslMode=REQUIRED&serverTimezone=UTC
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
