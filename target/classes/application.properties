spring.application.name=campushire
server.port=8080

# Database configuration (MySQL override via environment variables; H2 is the default local fallback)
spring.datasource.url=${DB_URL:jdbc:h2:mem:campushire;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT configuration
app.jwt.secret=${JWT_SECRET:campushire-dev-secret-change-me}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.admin.init-token=${ADMIN_INIT_TOKEN:campushire-admin-init}
app.admin.default-email=${ADMIN_EMAIL:admin@campushire.com}
app.admin.default-password=${ADMIN_PASSWORD:Admin@123}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

# Logging
logging.level.org.springframework.security=INFO
logging.level.app.campushire=DEBUG
