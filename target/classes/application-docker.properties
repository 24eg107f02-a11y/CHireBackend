spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/campushire?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:campushire}
spring.datasource.password=${DB_PASSWORD:campushirepass}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.h2.console.enabled=false
app.jwt.secret=${JWT_SECRET:replace-with-a-production-grade-secret-at-least-32-bytes-long}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.admin.default-email=${ADMIN_EMAIL:admin@campushire.com}
app.admin.default-password=${ADMIN_PASSWORD:Admin@123}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
